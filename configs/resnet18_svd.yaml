model:
  name: "resnet18"
  
dataset:
  name: "cifar10"
  path: "data/cifar10"
  train_args:
    batch_size: 512
    aug:
      flip: true
      translate: 2
  test_args:
    batch_size: 512

training:
  epochs: 10
  batch_size: 512
  
  # Loss configuration
  loss:
    type: "cross_entropy"
    label_smoothing: 0.2
  
  # No special initialization needed for ResNet
  warmup: false
  
  optimizer_groups:
    # AdamW for initial conv1 (select first to exclude it from SVD group)
    - name: "conv1"
      param_selector:
        type: "name_match"
        pattern: "conv1.weight"
      optimizer:
        type: "adamw"
        lr: 0.001
        weight_decay: 0.001
        eps: 0.000001
      lr_schedule:
        type: "linear_decay"
        total_steps: "total_epochs"
    
    # AdamW for batch norm parameters (main path and shortcuts)
    - name: "batch_norm"
      param_selector:
        type: "name_contains_multiple"
        patterns: ["bn", "shortcut.1"]
      optimizer:
        type: "adamw"
        lr: 0.001
        weight_decay: 0.001
        eps: 0.000001
      lr_schedule:
        type: "linear_decay"
        total_steps: "total_epochs"
    
    # AdamW for final linear layer
    - name: "linear"
      param_selector:
        type: "name_contains"
        pattern: "linear"
      optimizer:
        type: "adamw"
        lr: 0.001
        weight_decay: 0.001
        eps: 0.000001
      lr_schedule:
        type: "linear_decay"
        total_steps: "total_epochs"
    
    # SVD for all other conv layers (in BasicBlocks and shortcuts)
    # This will match all remaining 4D tensors (conv weights) after excluding conv1
    - name: "conv_filters"
      param_selector:
        type: "shape_match"
        ndim: 4
      optimizer:
        type: "svd"
        lr: 0.01
        momentum: 0.99
        weight_decay: 0.001
        track_singulars: false
      lr_schedule:
        type: "linear_decay"
        total_steps: "total_epochs"

  evaluation:
    tta_level: 0

  wandb:
    project: "svd-cnn-sweep"
